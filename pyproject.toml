[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memory"
version = "0.1.0"
description = "Lean memory service for Claude Code — MCP server + CLI"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20.0",
    "sqlite-vec>=0.1.6",
    "onnxruntime>=1.14.0",
    "tokenizers>=0.15.0",
    "numpy>=1.24.0",
    "mcp>=1.8.0,<2.0.0",
]

[dependency-groups]
test = ["pytest>=8.0"]
bench = ["mlx>=0.22.0", "safetensors>=0.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
memory = "memory.cli:main"
memory-mcp-server = "memory.mcp_server:main"
