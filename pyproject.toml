[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memory"
version = "1.12.0"
description = "Lean memory service for Claude Code — MCP server + CLI"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20.0",
    "sqlite-vec>=0.1.6",
    "onnxruntime>=1.14.0",
    "tokenizers>=0.15.0",
    "mlx>=0.30.0; sys_platform == 'darwin'",
    "mlx-embeddings>=0.1.0; sys_platform == 'darwin'",
    "numpy>=1.24.0",
    "mcp>=1.8.0,<2.0.0",
]

[dependency-groups]
test = ["pytest>=8.0"]
bench = ["mlx>=0.22.0", "safetensors>=0.4.0"]
lint = ["ruff>=0.9.0", "bandit>=1.8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# bench_consolidate.py is a report script that also carries two regression
# guards. Without this it is never collected and the guards never run.
python_files = ["test_*.py", "bench_consolidate.py"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "S",      # flake8-bandit (security)
    "T20",    # flake8-print
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]
ignore = [
    "S101",   # assert in tests is fine
    "T201",   # print() is used in CLI
]
# `×` is deliberate: the scoring formulas are documented as
# `confidence × importance × recency`, where an ASCII `x` would read as a
# variable name rather than as multiplication.
allowed-confusables = ["×"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "S310"]  # asserts + subprocess + URL downloads in tests OK
"src/memory/core.py" = ["S608"]  # parameterized SQL with ? placeholders is safe
"src/memory/mlx_model.py" = ["A001", "E501", "RUF005"]  # vendored from mlx_embeddings
"src/memory/embeddings.py" = ["S608", "S310"]  # parameterized SQL + known URL downloads
"src/memory/provenance.py" = ["S603", "S607"]  # git from PATH, fixed argv, no shell
# Analysis scripts, not shipped code. f-string SQL is a generated run of "?"
# placeholders with bound params (S608); random is corpus sampling, not crypto
# (S311); a transcript that will not parse is skipped deliberately (S112).
"benchmarks/session_analytics.py" = ["S608", "S311", "S112", "N806"]
"benchmarks/probe_p3_index_churn.py" = ["S311"]
"benchmarks/probe_p5_injection_diversity.py" = ["S608", "S311", "BLE001"]
"tests/bench_probe_p1.py" = ["S608", "S311"]

[tool.ruff.format]
quote-style = "double"

[tool.bandit]
exclude_dirs = ["tests"]

[project.scripts]
memory = "memory.cli:main"
memory-mcp-server = "memory.mcp_server:main"
memory-daemon = "memory.daemon:main"
